[package]
name = "plus_bot"
version = "0.1.0"
authors = ["my name <my@email.address>"]
edition = "2018"

[dependencies]
dotenv = "0.15"
tracing = "0.1.23"
tracing-subscriber = "0.3"
reqwest = { version = "0.11", features = ["json"] } # 노션에 HTTP 요청을 보내기 위함
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3.33"

[dependencies.tokio]
version = "1.0"
features = ["macros", "signal", "rt-multi-thread"]

[dependencies.serenity]
version = "0.12"
features = ["cache", "framework", "standard_framework", "rustls_backend"]
